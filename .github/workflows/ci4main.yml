name: main CI

on: 
    push:
      branches:
      - main
    pull_request:
      branches:
      - main
    workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest
      
      steps:
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.13'
  
        - name: Check out branch main
          uses: actions/checkout@v7
          with:
            ref: main
  
        - uses: actions/checkout@v7
          with:
            repository: adafruit/ci-arduino
            path: ci
              
        - name: pre-install
          run: bash ci/actions_install.sh
      
        - name: build test
          run: python3 ci/build_platform.py esp32